name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
    - uses: actions/checkout@v4

    # Install Rust toolchain (stable)
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        profile: minimal

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    #
    # Android-specific setup and build
    #
    # The steps below:
    # - install a JDK (needed by Android commandline tools),
    # - download Android command-line tools,
    # - install platform-tools, a platform and the NDK via sdkmanager,
    # - export ANDROID_NDK_HOME and add ~/.cargo/bin to PATH,
    # - add the Android Rust target,
    # - install cargo-ndk,
    # - run cargo ndk for arm64-v8a
    #
    - name: Setup Java (needed by Android sdkmanager)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '11'

    - name: Install Android SDK command-line tools and NDK
      env:
        ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      run: |
        set -eux

        # Prepare SDK root
        mkdir -p "$ANDROID_SDK_ROOT"
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

        # Download latest command line tools (version in URL may need to be updated as Google updates them)
        # If this URL breaks in future, update it to the latest commandlinetools-linux zip from Google.
        curl -fSL https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -o /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools

        # Move into expected layout: cmdline-tools/latest/...
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        mv /tmp/cmdline-tools/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

        # Make sdkmanager available via full path
        SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

        # Install platform-tools, a platform and a specific NDK version.
        # You can change API level and NDK version to what you need.
        yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "ndk;25.2.9519653"

        # Export environment variables for later steps
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

        # Add cargo bin and sdk tools to PATH for subsequent steps
        echo "PATH=$HOME/.cargo/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

    - name: Add Android Rust target(s)
      run: rustup target add aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --force

    - name: Build Android (arm64-v8a) with cargo-ndk
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
      run: |
        set -eux
        # Ensure cargo bin is on PATH (cargo install puts cargo-ndk in ~/.cargo/bin)
        export PATH="$HOME/.cargo/bin:$PATH"

        # Build for arm64-v8a using cargo-ndk. Adjust features or flags as needed.
        cargo ndk -t arm64-v8a build --release --features keystone
